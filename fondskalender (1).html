<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idrætssamvirket Aarhus’ fondskalender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primaer: #7e1624;      /* Primær brand (logo) */
    --roed: #cf1321;         /* Sekundær sportsrød */
    --groen: #2d8c72;        /* Sekundær sportsgrøn */
    --blaa: #527dba;         /* Thor blå */
    --lys: #f5f3e6;          /* Thor lys */
    --graa-lys: #8596a0;     /* Tertiær lys grå */
    --graa-moerk: #4e6070;   /* Tertiær mørk grå */
    --sort: #000000;
    --hvid: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--hvid); color: var(--sort);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.45; }
  header.top { background: var(--primaer); padding: 14px 16px; }
  header.top .inner { max-width: 760px; margin: 0 auto; }
  header.top img { display: block; height: 34px; width: auto; }
  main { max-width: 760px; margin: 0 auto; padding: 18px 16px 24px; }
  h1, h2 { font-family: "Quicksand", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 700; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; color: var(--primaer); }
  .sub { color: var(--graa-moerk); margin: 0 0 16px; font-size: .95rem; }
  h2 { font-size: 1.05rem; margin: 26px 0 10px; color: var(--primaer);
    padding-bottom: 6px; border-bottom: 2px solid var(--primaer); }
  h2.stille { color: var(--graa-moerk); border-bottom-color: var(--graa-lys); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li { position: relative; display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: center;
    background: var(--lys); border: 1px solid #e3dfc8; border-left: 5px solid var(--primaer);
    border-radius: 8px; padding: 12px 14px; }
  li.past { opacity: .65; border-left-color: var(--graa-lys); }
  li.loebende { border-left-color: var(--groen); }
  .dato { text-align: center; line-height: 1.1; color: var(--primaer); }
  .dato .dag { display: block; font-size: 1.7rem; font-weight: 700; }
  .dato .md { display: block; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--graa-moerk); }
  .dato .ar { display: block; font-size: .75rem; color: var(--graa-moerk); }
  .dato.loeb { color: var(--groen); font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .dato.loeb svg { display: block; margin: 0 auto 2px; }
  .navn { padding-right: 30px; font-weight: 600; margin: 0 0 6px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: .9rem; }
  .badge { padding: 2px 9px; border-radius: 999px; font-size: .8rem; font-weight: 600; }
  .soon { background: #fbe3e5; color: #8f0e1a; }
  .near { background: #e4e9ee; color: #34444f; }
  .ok { background: #def0ea; color: #1b5c49; }
  .past-b { background: #eceff2; color: var(--graa-moerk); }
  .loeb-b { background: #def0ea; color: #1b5c49; }
  a { color: var(--primaer); font-weight: 600; }
  a.laes { display: inline-flex; align-items: center; gap: 5px; }
  a:hover { color: var(--roed); }
  a:focus-visible { outline: 3px solid var(--blaa); outline-offset: 2px; border-radius: 3px; }
  .beloeb { margin: 0 0 6px; font-size: .95rem; font-weight: 600; color: var(--graa-moerk); }
  .filter { margin: 0 0 14px; }
  .switch { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 2px; font: inherit; font-weight: 600; color: var(--sort); cursor: pointer; }
  .switch .track { position: relative; width: 42px; height: 24px; border-radius: 999px; background: var(--graa-lys); transition: background .15s; flex: none; }
  .switch .thumb { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--hvid); transition: transform .15s; }
  .switch[aria-checked="true"] .track { background: var(--groen); }
  .switch[aria-checked="true"] .thumb { transform: translateX(18px); }
  .switch:focus-visible { outline: 3px solid var(--blaa); outline-offset: 2px; border-radius: 6px; }
  .sort { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
  .sort-label { font-size: .9rem; font-weight: 600; color: var(--graa-moerk); margin-right: 2px; }
  .sort label { position: relative; }
  .sort input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .sort label span { display: inline-block; padding: 5px 12px; border: 1px solid var(--graa-lys); border-radius: 999px; font-size: .9rem; font-weight: 600; cursor: pointer; background: var(--hvid); color: var(--graa-moerk); }
  .sort input:checked + span { background: var(--primaer); border-color: var(--primaer); color: var(--hvid); }
  .sort input:focus-visible + span { outline: 3px solid var(--blaa); outline-offset: 2px; }
  .frister { font-weight: 400; font-size: .85rem; }
  .fold { position: relative; }
  .fold.collapsed { overflow: hidden; }
  .fold.collapsed::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(to bottom, rgba(255,255,255,0), #ffffff); pointer-events: none; }
  .seflere { display: block; margin: 14px auto 0; padding: 8px 22px; border: 2px solid var(--primaer); border-radius: 999px; background: var(--hvid); color: var(--primaer); font: inherit; font-weight: 700; cursor: pointer; }
  .seflere:hover { background: var(--primaer); color: var(--hvid); }
  .seflere:focus-visible { outline: 3px solid var(--blaa); outline-offset: 2px; }
  .groen-ikon { position: absolute; top: 10px; right: 12px; font-size: 1.25rem; line-height: 1; cursor: help; }
  .groen-ikon::after { content: attr(data-tip); position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; background: var(--graa-moerk); color: var(--hvid); font-size: .8rem; font-weight: 600; padding: 5px 10px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; }
  .groen-ikon:hover::after, .groen-ikon:focus::after { opacity: 1; }
  .groen-ikon:focus-visible { outline: 3px solid var(--blaa); outline-offset: 2px; border-radius: 4px; }
  .intro { color: var(--graa-moerk); margin: 0 0 10px; font-size: .95rem; }
  .intro a { font-weight: 600; }
  .fejl { color: var(--roed); font-size: .9rem; margin: 0 0 10px; }
  .soeg { margin: 14px 0; }
  .soeg input { width: 100%; padding: 10px 16px; border: 1px solid var(--graa-lys); border-radius: 999px; font: inherit; background: var(--hvid); color: var(--sort); }
  .soeg input:focus-visible { outline: 3px solid var(--blaa); outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
  .chip { padding: 5px 12px; border: 1px solid var(--graa-lys); border-radius: 999px; font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer; background: var(--hvid); color: var(--graa-moerk); }
  .chip[aria-pressed="true"] { background: var(--primaer); border-color: var(--primaer); color: var(--hvid); }
  .chip:focus-visible { outline: 3px solid var(--blaa); outline-offset: 2px; }
  .egen-logo { position: absolute; right: 12px; bottom: 10px; height: 20px; width: auto; }
  @media (max-width: 520px) { .egen-logo { position: static; display: block; margin: 0 0 8px; } }
  .tom { color: var(--graa-moerk); padding: 12px 0; }
  @media (max-width: 420px) { li { grid-template-columns: 60px 1fr; gap: 10px; } header.top img { height: 28px; } }
</style>
</head>

/* ============================================================ */

const MAANEDER = ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const MAANEDER_LANG = ["januar","februar","marts","april","maj","juni","juli","august","september","oktober","november","december"];

let filterAktiv = false;
let sortering = "dato";
let udfoldet = false;
let kommendeAntal = 0;
const MOBIL = "(max-width: 520px)";   // samme breakpoint som logo-layoutet
let soeg = "";
const valgteBeloeb = new Set();
const BEL = { "0-25000": [0, 25000], "25001-50000": [25001, 50000], "50001-100000": [50001, 100000], "100000+": [100001, Infinity] };
const harBeloeb = p => typeof p.maxBeloeb === "number" && p.maxBeloeb > 0;
let alleData = [];
const erLoebende = p => !p.frist || p.frist === "loebende";
const erMoelle = p => p.frist === "foerst-til-moelle";
const nokkel = p => erMoelle(p) ? p.aabner : p.frist;
const datoVaerdi = p => /^\d{4}-\d{2}-\d{2}$/.test(nokkel(p) || "") ? parseDato(nokkel(p)).getTime() : 0;
const datoSort = l => l.slice().sort((a, b) => parseDato(nokkel(a)) - parseDato(nokkel(b)));
function parseDato(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function dageTil(dato) {
  const nu = new Date();
  const i_dag = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate());
  return Math.round((dato - i_dag) / 86400000);
}
function status(dage) {
  if (dage < 0) return { cls: "past-b", tekst: "Udløbet" };
  if (dage === 0) return { cls: "soon", tekst: "I dag" };
  if (dage === 1) return { cls: "soon", tekst: "I morgen" };
  if (dage <= 7) return { cls: "soon", tekst: "Om " + dage + " dage" };
  if (dage <= 21) return { cls: "near", tekst: "Om " + dage + " dage" };
  return { cls: "ok", tekst: "Om " + dage + " dage" };
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function link(p) {
  if (!p.url) return null;
  const a = el("a", "laes");
  a.href = p.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.setAttribute("aria-label", "Læs mere om " + p.navn + " (åbner i nyt vindue)");
  a.append("Læs mere");
  const ikon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  ikon.setAttribute("width", "14"); ikon.setAttribute("height", "14");
  ikon.setAttribute("viewBox", "0 0 24 24"); ikon.setAttribute("fill", "none");
  ikon.setAttribute("stroke", "currentColor"); ikon.setAttribute("stroke-width", "2.5");
  ikon.setAttribute("stroke-linecap", "round"); ikon.setAttribute("stroke-linejoin", "round");
  ikon.setAttribute("aria-hidden", "true");
  ikon.innerHTML = '<path d="M14 4h6v6"/><path d="M20 4L10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>';
  a.append(ikon);
  return a;
}

function kort(p) {
  const loeb = erLoebende(p);
  const moelle = erMoelle(p);
  const d = (loeb || moelle) ? null : parseDato(p.frist);
  const dage = (loeb || moelle) ? 0 : dageTil(d);
  const li = el("li", loeb ? "loebende" : (dage < 0 ? "past" : ""));

  let venstre;
  if (moelle) {
    const ad = parseDato(p.aabner);
    const ord = dageTil(ad) < 0 ? "Åbnede" : "Åbner";
    venstre = el("time", "dato");
    venstre.dateTime = p.aabner;
    venstre.setAttribute("aria-label", ord + " " + ad.getDate() + ". " + MAANEDER_LANG[ad.getMonth()] + " " + ad.getFullYear());
    venstre.append(el("span", "md", ord), el("span", "dag", String(ad.getDate())), el("span", "md", MAANEDER[ad.getMonth()]), el("span", "ar", String(ad.getFullYear())));
  } else if (loeb) {
    venstre = el("div", "dato loeb");
    venstre.innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>';
    venstre.append("Løbende");
  } else {
    venstre = el("time", "dato");
    venstre.dateTime = p.frist;
    venstre.setAttribute("aria-label", d.getDate() + ". " + MAANEDER_LANG[d.getMonth()] + " " + d.getFullYear());
    venstre.append(el("span", "md", "Deadline"),
                   el("span", "dag", String(d.getDate())),
                   el("span", "md", MAANEDER[d.getMonth()]),
                   el("span", "ar", String(d.getFullYear())));
  }

  const body = el("div");
  const navnP = el("p", "navn");
  let groenIkon = null;
  if (p.groen === true) {
    const ik = el("span", "groen-ikon", "♻️");
    ik.tabIndex = 0;
    ik.setAttribute("role", "img");
    ik.setAttribute("aria-label", "Særlig relevant for grøn omstilling");
    ik.dataset.tip = "Særlig relevant for grøn omstilling";
    groenIkon = ik;
  }
  navnP.append(p.navn);
  body.append(navnP);
  if (p.beloebTekst) body.append(el("p", "beloeb", p.beloebTekst));
  else if (typeof p.maxBeloeb === "number" && p.maxBeloeb > 0)
    body.append(el("p", "beloeb", "Søg op til " + p.maxBeloeb.toLocaleString("da-DK") + " kr."));
  else body.append(el("p", "beloeb", "Maxbeløb ikke oplyst"));

  const meta = el("div", "meta");
  if (moelle) {
    meta.append(el("span", "badge soon", "Uddeles efter Først-til-mølle 🔥"));
  } else if (loeb) {
    meta.append(el("span", "badge loeb-b", "Kan søges løbende"));
  } else {
    const st = status(dage);
    meta.append(el("span", "badge " + st.cls, st.tekst));
  }
  const l = link(p);
  if (l) meta.append(l);
  body.append(meta);
  li.append(venstre, body);
  if (groenIkon) li.append(groenIkon);
  if (p.egen === true) {
    const lg = el("img", "egen-logo");
    lg.src = EGEN_LOGO; lg.alt = ""; lg.setAttribute("aria-hidden", "true");
    body.prepend(lg);
  }
  return li;
}

function fyld(id, liste) {
  const ul = document.getElementById(id);
  ul.replaceChildren();
  liste.forEach(p => ul.append(kort(p)));
}

function medNaesteFrist(p) {
  if (Array.isArray(p.fristListe) && p.fristListe.length) {
    const sorteret = p.fristListe.slice().sort();
    const naeste = sorteret.find(s => dageTil(parseDato(s)) >= 0) || sorteret[sorteret.length - 1];
    return Object.assign({}, p, { frist: naeste });
  }
  if (!Array.isArray(p.aarligeFrister) || !p.aarligeFrister.length) return p;
  const aar = new Date().getFullYear();
  const kandidater = [];
  for (const y of [aar, aar + 1]) p.aarligeFrister.forEach(md => kandidater.push(y + "-" + md));
  const naeste = kandidater.sort().find(s => dageTil(parseDato(s)) >= 0);
  const tekst = p.aarligeFrister.map(md => {
    const [m, d] = md.split("-").map(Number);
    return d + ". " + MAANEDER_LANG[m - 1];
  }).join(" · ");
  return Object.assign({}, p, { frist: naeste, fristerTekst: "Frister hvert år: " + tekst });
}

const vinduesSlut = () => { const n = new Date(); return new Date(n.getFullYear() + 1, n.getMonth(), n.getDate()); };
const iVinduet = s => { const d = parseDato(s); return dageTil(d) >= 0 && d <= vinduesSlut(); };

/* Ét kort pr. frist de kommende 12 måneder */
function udfold(p) {
  if (Array.isArray(p.aarligeFrister) && p.aarligeFrister.length) {
    const aar = new Date().getFullYear();
    const datoer = [];
    for (const y of [aar, aar + 1, aar + 2]) p.aarligeFrister.forEach(md => datoer.push(y + "-" + md));
    return datoer.sort().filter(iVinduet).map(s => Object.assign({}, p, { frist: s }));
  }
  if (Array.isArray(p.fristListe) && p.fristListe.length)
    return p.fristListe.slice().sort().filter(iVinduet).map(s => Object.assign({}, p, { frist: s }));
  if (erMoelle(p)) return parseDato(p.aabner) <= vinduesSlut() ? [p] : [];
  if (erLoebende(p)) return [p];
  return iVinduet(p.frist) ? [p] : [];
}

function sorter(liste) {
  if (sortering !== "beloeb") return liste;
  return liste.slice().sort((a, b) =>
    (b.maxBeloeb || 0) - (a.maxBeloeb || 0) ||
    (datoVaerdi(a) - datoVaerdi(b)));
}

/* Vis kun de første ANTAL kort; resten fades ud indtil "Se flere" */
function foldKommende() {
  const wrap = document.getElementById("foldWrap");
  const ul = document.getElementById("kommende");
  const knap = document.getElementById("seFlere");
  const kort = Array.from(ul.children);
  const ANTAL = window.matchMedia(MOBIL).matches ? 1 : 3;   // synlige kort: mobil 1, desktop 3
  const skjul = kommendeAntal > ANTAL && !udfoldet;
  kort.forEach((li, i) => { li.inert = skjul && i >= ANTAL; });
  wrap.classList.toggle("collapsed", skjul);
  wrap.style.maxHeight = skjul ? (kort[ANTAL].offsetTop + 70) + "px" : "";
  knap.hidden = kommendeAntal <= ANTAL;
  knap.textContent = udfoldet ? "Se færre 💰" : "Se flere 💰";
  knap.setAttribute("aria-expanded", String(udfoldet));
}

function matcher(p) {
  if (filterAktiv && p.groen !== true) return false;
  const q = soeg.trim().toLowerCase();
  if (q && !p.navn.toLowerCase().includes(q)) return false;
  if (valgteBeloeb.size && harBeloeb(p)) {   // kort uden beløb vises altid
    let ok = false;
    valgteBeloeb.forEach(k => { const [a, b] = BEL[k]; if (p.maxBeloeb >= a && p.maxBeloeb <= b) ok = true; });
    if (!ok) return false;
  }
  return true;
}

function vis(alle) {
  const grund = alle.filter(matcher);
  const data = grund.flatMap(udfold);
  const faste = data.filter(p => !erLoebende(p) && !erMoelle(p))
    .sort((a, b) => parseDato(a.frist) - parseDato(b.frist));
  const kommende = sorter(datoSort(data.filter(erMoelle).concat(faste.filter(p => dageTil(parseDato(p.frist)) >= 0))));
  const loebende = sorter(data.filter(erLoebende));

  fyld("kommende", kommende);
  kommendeAntal = kommende.length;
  foldKommende();
  const tom = document.getElementById("tom");
  tom.hidden = kommende.length > 0;
  tom.textContent = (filterAktiv || soeg.trim() || valgteBeloeb.size) ? "Ingen puljer matcher dine valg." : "Der er ingen kommende frister med fast dato lige nu.";

  fyld("loebende", loebende);
  document.getElementById("loebende-wrap").hidden = !loebende.length;
  sendHoejde();
}

/* Iframe: fortæl værtssiden hvor høj siden er */
function sendHoejde() {
  if (window.parent === window) return;
  window.parent.postMessage({ type: "frister-hoejde", hoejde: document.documentElement.scrollHeight }, "*");
}
if ("ResizeObserver" in window) new ResizeObserver(sendHoejde).observe(document.body);
window.addEventListener("load", sendHoejde);

async function start() {
  let data = EKSEMPELDATA;
  if (DATA_URL) {
    try {
      const r = await fetch(DATA_URL, { cache: "no-cache" });
      if (!r.ok) throw new Error(r.status);
      data = await r.json();
    } catch (e) {
      const f = document.getElementById("fejl");
      f.textContent = "Kunne ikke hente de nyeste frister – viser en reserveudgave, som kan være forældet.";
      f.hidden = false;
    }
  }
  alleData = data;
  const knap = document.getElementById("groenFilter");
  knap.addEventListener("click", () => {
    filterAktiv = !filterAktiv;
    knap.setAttribute("aria-checked", String(filterAktiv));
    vis(alleData);
  });
  document.getElementById("seFlere").addEventListener("click", () => {
    udfoldet = !udfoldet;
    foldKommende();
    sendHoejde();
  });
  document.getElementById("soeg").addEventListener("input", e => { soeg = e.target.value; vis(alleData); });
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    const k = c.dataset.bel;
    if (valgteBeloeb.has(k)) valgteBeloeb.delete(k); else valgteBeloeb.add(k);
    c.setAttribute("aria-pressed", String(valgteBeloeb.has(k)));
    vis(alleData);
  }));
  window.addEventListener("resize", () => foldKommende());
  vis(alleData);
}
start();
</script>
